name: Push AI Review

# push 到这两个分支时自动审查本次改动
on:
  push:
    branches: [dev-jun, main]

permissions:
  contents: read

jobs:
  lint:
    name: Ruff 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装 ruff
        run: pip install ruff
      - name: 只检查本次改动涉及的 .py 文件
        run: |
          FILES=$(git diff --name-only HEAD~1..HEAD -- '*.py' | tr '\n' ' ')
          if [ -n "$FILES" ]; then
            ruff check $FILES --output-format=github
          else
            echo "本次无 Python 改动，跳过 ruff"
          fi

  ai_review:
    name: AI 代码审查
    runs-on: ubuntu-latest
    needs: lint          # lint 失败就不再花钱调 LLM
    if: ${{ always() && needs.lint.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史来取 BEFORE..AFTER diff
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 运行 AI 审查
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL_ID: ${{ secrets.LLM_MODEL_ID }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: python .github/scripts/ai_review.py
